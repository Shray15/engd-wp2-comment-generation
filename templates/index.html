<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Comment Generator & Analyzer</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a6fd8;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .progress {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-bar {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }
        .results {
            display: none;
        }
        .comment-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }
        .metrics {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .metric {
            background: white;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .summary-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Comment Generator & Analyzer</h1>
            <p>Generate realistic comments using LLAMA AI and analyze their sentiment & similarity</p>
        </div>

        <div class="card">
            <h2>⚙️ Configuration</h2>
            
            <div class="form-group">
                <button id="loadModels" onclick="loadModels()">🚀 Load AI Models</button>
            </div>
            
            <div id="modelStatus" class="alert" style="display: none;"></div>
            
            <div class="form-group">
                <label for="postText">📝 Post Text:</label>
                <textarea id="postText" placeholder="Enter your post text here..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="numComments">🔢 Number of Comments:</label>
                <input type="number" id="numComments" value="3" min="1" max="10">
            </div>
            
            <div class="form-group">
                <button id="generateBtn" onclick="generateComments()" disabled>💬 Generate Comments</button>
            </div>
            
            <div id="progress" class="progress" style="display: none;">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="results" class="results">
            <div class="card">
                <h2>📊 Analysis Results</h2>
                
                <div id="summary" class="summary"></div>
                
                <div id="charts" class="charts"></div>
                
                <h3>💬 Individual Comments</h3>
                <div id="comments"></div>
                
                <button onclick="exportResults()">📥 Export Results as CSV</button>
            </div>
        </div>
    </div>

    <script>
        let currentResults = null;

        async function loadModels() {
            const btn = document.getElementById('loadModels');
            const status = document.getElementById('modelStatus');
            
            btn.disabled = true;
            btn.textContent = '🔄 Loading Models...';
            
            try {
                const response = await fetch('/load_models', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    status.className = 'alert alert-success';
                    status.textContent = '✅ ' + data.message;
                    status.style.display = 'block';
                    btn.textContent = '✅ Models Loaded';
                    document.getElementById('generateBtn').disabled = false;
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                status.className = 'alert alert-error';
                status.textContent = '❌ Error: ' + error.message;
                status.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '🚀 Load AI Models';
            }
        }

        async function generateComments() {
            const postText = document.getElementById('postText').value.trim();
            const numComments = document.getElementById('numComments').value;
            
            if (!postText) {
                alert('Please enter some post text first.');
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            const progress = document.getElementById('progress');
            const results = document.getElementById('results');
            
            btn.disabled = true;
            btn.textContent = '🔄 Generating...';
            progress.style.display = 'block';
            results.style.display = 'none';
            
            // Simulate progress
            let progressValue = 0;
            const progressInterval = setInterval(() => {
                progressValue += 2;
                document.getElementById('progressBar').style.width = progressValue + '%';
                if (progressValue >= 90) {
                    clearInterval(progressInterval);
                }
            }, 100);
            
            try {
                const response = await fetch('/generate_comments', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        post_text: postText,
                        num_comments: parseInt(numComments)
                    })
                });
                const data = await response.json();
                
                clearInterval(progressInterval);
                document.getElementById('progressBar').style.width = '100%';
                
                if (data.status === 'success') {
                    currentResults = data;
                    displayResults(data);
                    setTimeout(() => {
                        progress.style.display = 'none';
                        results.style.display = 'block';
                    }, 500);
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                clearInterval(progressInterval);
                progress.style.display = 'none';
                alert('Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '💬 Generate Comments';
            }
        }

        function displayResults(data) {
            // Display summary
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <div class="summary-card">
                    <h3>${data.summary.total_comments}</h3>
                    <p>Total Comments</p>
                </div>
                <div class="summary-card">
                    <h3>${(data.summary.avg_similarity * 100).toFixed(1)}%</h3>
                    <p>Avg Similarity</p>
                </div>
                <div class="summary-card">
                    <h3>${data.summary.avg_sentiment.toFixed(0)}</h3>
                    <p>Avg Sentiment</p>
                </div>
            `;
            
            // Display charts
            const charts = document.getElementById('charts');
            charts.innerHTML = '';
            
            if (data.charts.similarity) {
                const simDiv = document.createElement('div');
                charts.appendChild(simDiv);
                Plotly.newPlot(simDiv, data.charts.similarity.data, data.charts.similarity.layout);
            }
            
            if (data.charts.sentiment) {
                const sentDiv = document.createElement('div');
                charts.appendChild(sentDiv);
                Plotly.newPlot(sentDiv, data.charts.sentiment.data, data.charts.sentiment.layout);
            }
            
            if (data.charts.intent) {
                const intentDiv = document.createElement('div');
                charts.appendChild(intentDiv);
                Plotly.newPlot(intentDiv, data.charts.intent.data, data.charts.intent.layout);
            }
            
            // Display individual comments
            const comments = document.getElementById('comments');
            comments.innerHTML = '';
            
            data.comments.forEach((comment, i) => {
                const similarity = data.similarities[i];
                const sentiment = data.sentiments[i];
                const intent = data.intents[i];
                
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment-card';
                commentDiv.innerHTML = `
                    <h4>💬 Comment ${i + 1}</h4>
                    <p><strong>${comment}</strong></p>
                    <div class="metrics">
                        <div class="metric">
                            <strong>🎯 Similarity:</strong> ${(similarity * 100).toFixed(1)}%
                        </div>
                        <div class="metric">
                            <strong>😊 Sentiment:</strong> ${sentiment.label} (${sentiment.score.toFixed(1)})
                        </div>
                        <div class="metric">
                            <strong>🎯 Intent:</strong> ${intent.intent} ${intent.confidence ? `(${(intent.confidence * 100).toFixed(1)}%)` : ''}
                        </div>
                    </div>
                `;
                comments.appendChild(commentDiv);
            });
        }

        async function exportResults() {
            if (!currentResults) {
                alert('No results to export. Generate comments first.');
                return;
            }
            
            try {
                const response = await fetch('/export_results', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(currentResults)
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'comment_analysis_results.csv';
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    throw new Error('Export failed');
                }
            } catch (error) {
                alert('Error exporting results: ' + error.message);
            }
        }
    </script>
</body>
</html>
